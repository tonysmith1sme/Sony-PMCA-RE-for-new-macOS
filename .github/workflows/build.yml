name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # This project targets macOS only.
        include:
          - name: macos-arm64
            os: macos-latest
          - name: macos-intel
            os: macos-latest
            rosetta: true
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required: the build scripts run `git describe`
          # to embed the version into the binaries.
          fetch-depth: 0

      - name: Install Python 3.14 with Tcl/Tk 9 (universal2)
        # The python.org installer is a universal2 binary bundling Tcl/Tk 9.0.4,
        # so the same package provides both the arm64 and the x86_64 (Rosetta) build.
        run: |
          curl -fsSL "https://www.python.org/ftp/python/3.14.7/python-3.14.7-macos11.pkg" -o /tmp/python.pkg
          sudo installer -pkg /tmp/python.pkg -target /
          echo "PYEXE=/Library/Frameworks/Python.framework/Versions/3.14/bin/python3.14" >> "$GITHUB_ENV"

      - name: Install Rosetta 2 (macOS x86_64)
        if: matrix.rosetta
        run: |
          softwareupdate --install-rosetta --agree-to-license
          echo "PYWRAP=arch -x86_64" >> "$GITHUB_ENV"

      - name: Build
        run: |
          $PYWRAP "$PYEXE" -m venv .venv
          VPY=.venv/bin/python
          $PYWRAP "$VPY" -m pip install --upgrade pip
          $PYWRAP "$VPY" -m pip install -r requirements.txt
          $PYWRAP "$VPY" -OO -m PyInstaller pmca-console.spec
          $PYWRAP "$VPY" -OO -m PyInstaller pmca-gui.spec

      - name: Add architecture to artifact names
        run: |
          arch=arm64
          if [ "${{ matrix.rosetta }}" = "true" ]; then arch=x86_64; fi
          for f in dist/*-osx*; do mv "$f" "${f/-osx/-osx-$arch}"; done
          ls -l dist/

      - name: Test
        run: |
          exe=$(ls dist/pmca-console* | head -1)
          "$exe" -h
          "$exe" --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes
